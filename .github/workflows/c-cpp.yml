name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: install depencencies
      run: |
        sudo apt-get install fastfetch #cppcheck
        fastfetch --logo none
    - name: make
      run: make -j4
    - name: make test
      run: make -j4 test
    - name: make install
      run: sudo make install
